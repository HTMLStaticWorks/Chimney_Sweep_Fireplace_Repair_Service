<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FlameCraft</title>
    <meta name="description" content="Sign in to your FlameCraft account to manage service requests, view service history, and access priority bookings.">
    <meta name="robots" content="noindex, follow">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
</head>
<body class="auth-page">

    <!-- Skip to Main Content Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Top Right Controls (Theme and RTL) -->
    <div class="auth-controls-container">
        <button class="control-btn" id="theme-toggle" aria-label="Switch to Dark Mode">
            <i class="bi bi-moon-stars"></i>
        </button>
        <button class="control-btn" id="rtl-toggle" aria-label="Switch to Right to Left Layout"><i class="bi bi-arrow-left-right"></i></button>
    </div>

    <!-- Centered Form Container -->
    <main id="main-content" class="d-flex flex-column align-items-center justify-content-center min-vh-100 py-5 px-3">
        
        <!-- Logo -->
        <div class="mb-4 text-center">
            <a href="index.html" id="brand-logo-link">
                <img src="assets/images/logo.svg" alt="FlameCraft Logo" style="height: 45px;">
            </a>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <h1 class="h3 fw-bold mb-1 text-center">Welcome Back</h1>
            <p class="small text-secondary text-center mb-4">Sign in to your luxury hearth care portal</p>
            
            <!-- Social Logins -->
            <div class="d-flex flex-column flex-sm-row gap-3 mb-4">
                <button type="button" class="btn btn-social w-100" id="google-login">
                    <i class="bi bi-google"></i> Google
                </button>
                <button type="button" class="btn btn-social w-100" id="apple-login">
                    <i class="bi bi-apple"></i> Apple
                </button>
            </div>

            <!-- Divider -->
            <div class="divider-container">
                <span class="divider-text">Or login with email</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="needs-validation-custom" novalidate aria-label="Login form">
                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control premium-form-control text-start" id="email" placeholder="name@example.com" required>
                    <div class="invalid-feedback-custom text-danger small mt-1" style="display: none;">Please enter a valid email address.</div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control premium-form-control text-start pe-5" id="password" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback-custom text-danger small mt-1" style="display: none;">Password is required.</div>
                </div>

                <!-- Remember Me & Forgot Password Line -->
                <div class="mb-4 d-flex align-items-center justify-content-between gap-1 flex-nowrap" style="white-space: nowrap;">
                    <div class="d-flex align-items-center">
                        <input class="form-check-input mt-0 me-2" type="checkbox" id="remember-me" style="border-color: var(--border-color); border-radius: 0; width: 1.1rem; height: 1.1rem; cursor: pointer; flex-shrink: 0;">
                        <label class="form-check-label small text-secondary" for="remember-me" style="cursor: pointer; user-select: none; font-size: 0.8rem;">
                            Remember me
                        </label>
                    </div>
                    <a href="404.html" class="small text-secondary hover-primary" style="font-size: 0.8rem;" id="forgot-password">Forgot Password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-premium w-100 mb-3" id="btn-login">Sign In</button>
                
                <!-- Signup Link -->
                <p class="small text-secondary text-center mb-0">
                    Don't have an account? <a href="signup.html" class="fw-bold text-decoration-underline" id="signup-link">Create Account</a>
                </p>
            </form>
        </div>

        <!-- Back to Home Link below the card -->
        <div class="mt-4 text-center">
            <a href="index.html" class="small text-secondary hover-primary"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Main JS -->
    <script src="assets/js/main.js"></script>

    <!-- Page Specific Script for Toggle Password & Custom Validation -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Password toggle logic
            const passwordField = document.getElementById('password');
            const toggleButton = document.getElementById('password-toggle');
            const toggleIcon = toggleButton.querySelector('i');

            toggleButton.addEventListener('click', () => {
                const isPassword = passwordField.type === 'password';
                passwordField.type = isPassword ? 'text' : 'password';
                
                // Toggle classes
                toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
                toggleButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
            });

            // Handle validation custom UI behavior specifically for email and password
            const form = document.getElementById('loginForm');
            const inputs = form.querySelectorAll('input[required]');

            // Real-time error hiding
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    if (input.classList.contains('is-invalid')) {
                        input.classList.remove('is-invalid');
                        const feedback = input.closest('.mb-3').querySelector('.invalid-feedback-custom');
                        if (feedback) feedback.style.display = 'none';
                    }
                });
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                e.stopPropagation();

                let isValid = true;
                
                // Validate Email
                const emailInput = document.getElementById('email');
                const emailFeedback = emailInput.nextElementSibling;
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) {
                    emailInput.classList.add('is-invalid');
                    emailFeedback.style.display = 'block';
                    isValid = false;
                } else {
                    emailInput.classList.remove('is-invalid');
                    emailInput.classList.add('is-valid');
                    emailFeedback.style.display = 'none';
                }

                // Validate Password
                const passInput = document.getElementById('password');
                const passFeedback = passInput.closest('.mb-3').querySelector('.invalid-feedback-custom');
                if (!passInput.value.trim()) {
                    passInput.classList.add('is-invalid');
                    passFeedback.style.display = 'block';
                    isValid = false;
                } else {
                    passInput.classList.remove('is-invalid');
                    passInput.classList.add('is-valid');
                    passFeedback.style.display = 'none';
                }

                if (isValid) {
                    const btn = document.getElementById('btn-login');
                    const originalText = btn.textContent;
                    btn.disabled = true;
                    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>SIGNING IN...';

                    setTimeout(() => {
                        btn.textContent = 'SIGN IN SUCCESSFUL';
                        btn.className = 'btn btn-success w-100 mb-3 rounded-0';
                        
                        // Create success toast/alert
                        const successAlert = document.createElement('div');
                        successAlert.className = 'alert alert-success mt-3 border-0 rounded-0 text-center';
                        successAlert.style.borderLeft = '3px solid var(--secondary-color)';
                        successAlert.innerHTML = `
                            <h5 class="fw-bold text-success mb-1">Authenticated!</h5>
                            <p class="small mb-0 text-secondary">Welcome back. Redirecting you to your account portal...</p>
                        `;
                        form.appendChild(successAlert);

                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    }, 1500);
                }
            });
        });
    </script>
</body>
</html>
