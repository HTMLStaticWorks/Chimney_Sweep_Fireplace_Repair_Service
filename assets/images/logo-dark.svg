<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <linearGradient id="copper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D48A5F" />
      <stop offset="100%" stop-color="#C07A4A" />
    </linearGradient>
  </defs>

  <!-- Flame & Chimney Icon — centered at y=40 (mid of 80px canvas) -->
  <!-- The paths start at Y=15 and end at Y=50 (height 35). To center at Y=40, translate by 7.5 -->
  <g transform="translate(10, 7.5)">
    <!-- Chimney outline -->
    <path d="M15 45 L15 15 L45 15 L45 45 Z" fill="none" stroke="url(#copper-grad)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M10 15 L50 15" stroke="url(#copper-grad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Flame inside -->
    <path d="M30 40 C35 40 38 35 38 30 C38 23 30 18 30 18 C30 18 22 23 22 30 C22 35 25 40 30 40 Z" fill="url(#copper-grad)" />
    <!-- Hearth Base -->
    <path d="M5 50 L55 50" stroke="url(#copper-grad)" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography — baseline aligned to icon midline -->
  <text
    x="82"
    y="40"
    font-family="'Outfit', sans-serif"
    font-size="34"
    font-weight="800"
    fill="#F5F5F5"
    letter-spacing="4"
    dominant-baseline="middle">FLAMECRAFT</text>
</svg>
